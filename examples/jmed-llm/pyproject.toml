[project]
name = "jmed-llm-examples"
version = "0.1.0"
description = "Data analysis example using jmed-llm dataset with Semaxis"
authors = [
    {name = "pillyshi"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.0.0,<8.0.0",
    "fugashi>=1.5.2,<2.0.0",
    "unidic-lite>=1.0.8,<2.0.0",
    "papermill>=2.7.0,<3.0.0",
    "notebook>=7.5.5,<8.0.0",
    "ipywidgets>=8.1.8,<9.0.0",
    "imbalanced-learn>=0.14.1,<0.15.0",
    "iterative-stratification>=0.1.9,<0.2.0",
    "mlflow>=3.13.0",
    "opentelemetry-proto>=1.20.0",
    "semaxis>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jmed_llm_examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
