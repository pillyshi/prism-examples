"stages":
  "smdis_small_download":
    "cmd": "poetry run python pipelines/smdis_small/download.py"
    "deps":
      - "pipelines/smdis_small/download.py"
    "outs":
      - "datasets/smdis.csv"
  "smdis_small_preprocess":
    "cmd": "poetry run python pipelines/smdis_small/preprocess.py"
    "deps":
      - "pipelines/smdis_small/preprocess.py"
      - "datasets/smdis.csv"
    "outs":
      - "artifacts/smdis_small/preprocess/rows.json"
  "smdis_small_split_folds":
    "cmd": "poetry run python pipelines/smdis_small/split_folds.py"
    "deps":
      - "pipelines/smdis_small/split_folds.py"
      - "artifacts/smdis_small/preprocess/rows.json"
    "outs":
      - "artifacts/smdis_small/split_folds/folds"
      - "artifacts/smdis_small/split_folds/mlb.joblib"
    "params":
      - "folds"
      - "seed"
  "smdis_small_transform":
    "do":
      "cmd": "poetry run python pipelines/smdis_small/transform.py --fold ${item}"
      "deps":
        - "pipelines/smdis_small/transform.py"
        - "artifacts/smdis_small/split_folds/folds/fold_${item}/train.npz"
        - "artifacts/smdis_small/split_folds/folds/fold_${item}/test.npz"
      "outs":
        - "artifacts/smdis_small/transform/folds/fold_${item}/transformer.joblib"
        - "artifacts/smdis_small/transform/folds/fold_${item}/train.npz"
        - "artifacts/smdis_small/transform/folds/fold_${item}/test.npz"
      "params":
        - "embedding_model"
        - "folds"
        - "llm"
        - "n_features"
        - "nli_model"
        - "sample_method"
        - "seed"
    "foreach":
      - 0
      - 1
      - 2
      - 3
      - 4
